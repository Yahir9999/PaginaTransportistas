<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS externo -->
  <link rel="stylesheet" href="css/login.css">

  <title>Iniciar Sesión</title>
</head>

<body>

  <div class="login-container">

    <!-- Logo -->
    <img src="Logos/VENTO.png" class="vento-logo" alt="Vento">

    <!-- Card -->
    <div class="login-card">

      <!-- Icono usuario -->
      <img src="iconos/usuario.png" class="user-icon" alt="user">

      <!-- Input correo -->
      <div class="input-group-custom">
        <img src="iconos/correo.png" class="input-icon" alt="mail">
        <input type="email" id="email" placeholder="Correo electrónico">
      </div>

      <!-- Input contraseña -->
      <div class="input-group-custom">
        <img src="iconos/contraseña.png" class="input-icon" alt="password">
        <input type="password" id="password" placeholder="Contraseña">
      </div>

      <!-- Botón iniciar sesión -->
      <button class="btn-login" onclick="loginUser()">Inicia sesión</button>

    </div>
  </div>

  <script>
    function loginUser() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Aquí conectas Firebase Auth
      console.log("Intentando iniciar sesión con:", email, password);
    }
  </script>

</body>
</html>
