<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS externo -->
  <link rel="stylesheet" href="../../CSS/transportista.css">

  <title>Transportistas</title>
</head>

<body>

  <div class="main-wrapper">

    <!-- Logo -->
    <img src="../../Logos/VENTO.png" class="vento-logo" alt="Vento">

    <!-- Título -->
    <h2 class="title">TRANSPORTISTAS CEDIS</h2>

    <!-- CARD: REGISTRO CEDI -->
    <div class="card-option">
      <h5>REGISTRO CEDI</h5>
      <p>Registra tu entrada y salida del centro<br>de distribución</p>
      <button class="btn-ir" onclick="goTo('cedi.html')">IR</button>
    </div>

    <!-- CARD: REGISTRO AGENCIA -->
    <div class="card-option">
      <h5>REGISTRO AGENCIA/CLIENTE</h5>
      <p>Registra tu entrada y salida a la Agencia<br>o con el cliente</p>
      <button class="btn-ir" onclick="goTo('agencia.html')">IR</button>
    </div>

    <!-- CARD: ENTREGA DE EVIDENCIAS -->
    <div class="card-option">
      <h5>ENTREGA DE EVIDENCIAS</h5>
      <p>Sube las evidencias correspondientes</p>
      <button class="btn-ir" onclick="goTo('evidencias.html')">IR</button>
    </div>

  </div>

  <script>
    function goTo(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
