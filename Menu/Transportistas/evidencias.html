<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="../../node_modules_bootstrap_placeholder_or_cdn" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../../CSS/evidencias.css">

  <title>Entrega de Evidencias</title>
</head>
<body>

  <div class="main-wrapper">

    <!-- Logo -->
    <img src="../../Logos/VENTO.png" class="vento-logo" alt="Vento">

    <h2 class="title">ENTREGA DE EVIDENCIAS</h2>

    <div class="card-evidencias">

      <!-- Subida de fotos -->
      <div class="upload-box">
        <h5>Subir fotografías</h5>
        <p class="muted">Puedes subir entre 1 y 4 imágenes.</p>

        <input 
        type="file" 
        id="file-input" 
        accept="image/*" 
        capture="environment" 
        multiple
        >


        <button id="btn-upload" class="btn-action">Subir evidencias</button>
      </div>

      <!-- Vista previa -->
      <div id="preview" class="preview"></div>

      <!-- Mensaje -->
      <div id="message" class="message" aria-live="polite"></div>

    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script src="../../js/firebaseConfig.js"></script>
  <script src="../../js/registro_evidencias.js"></script>

</body>
</html>
