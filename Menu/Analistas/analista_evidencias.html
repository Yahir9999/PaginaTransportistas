<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="../../node_modules_bootstrap_placeholder_or_cdn" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../../CSS/analista_evidencias.css">

  <title>Evidencias - Analista</title>
</head>
<body>

  <div class="main-wrapper">

    <!-- Logo -->
    <img src="../../Logos/VENTO.png" class="vento-logo" alt="Vento">

    <h2 class="title">EVIDENCIAS</h2>

    <div class="card-evidencias">

      <!-- Lista -->
      <div id="evidencias-list" class="evidencias-list">
        <p class="muted">Cargando evidencias...</p>
      </div>
    </div>
  </div>

  <!-- Modal para ver imagen grande -->
  <div class="modal" id="imgModal">
    <span class="close" id="closeModal">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script src="../../js/firebaseConfig.js"></script>
  <script src="../../js/analista_evidencias.js"></script>

</body>
</html>
