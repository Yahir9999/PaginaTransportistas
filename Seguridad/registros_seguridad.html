<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro CEDI - Seguridad</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FUENTE -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/registros_seguridad.css">

    <!-- Lector de QR -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>

</head>
<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">Registro CEDI</h2>

    <!-- TARJETA: ESCANEO QR (LLEGADA) -->
    <div class="card mb-4">
        <h3>Escanear Credencial (Llegada)</h3>
        <p>Escanea el QR del transportista para registrar su llegada.</p>

        <div id="qr-reader" style="width:100%;"></div>

        <div class="mt-3">
            <label class="form-label">ID Transportista</label>
            <input type="text" id="id_transportista" class="form-control" readonly>

            <label class="form-label mt-2">Nombre</label>
            <input type="text" id="nombre" class="form-control" readonly>

            <label class="form-label mt-2">Línea de Transporte</label>
            <input type="text" id="linea" class="form-control" readonly>

            <label class="form-label mt-2">Placas</label>
            <input type="text" id="placas" class="form-control" readonly>

            <label class="form-label mt-2">Unidad</label>
            <input type="text" id="unidad" class="form-control" readonly>
        </div>

        <button class="btn w-100 mt-3" id="btnRegistrarLlegada">Registrar Llegada</button>
    </div>


    <!-- TARJETA: REGISTRO TO -->
    <div class="card mb-4">
        <h3>Registrar TO (Salida)</h3>
        <p>Ingresa las TO entregadas por el transportista al salir del CEDI.</p>

        <label class="form-label">¿Cuántas TO tiene?</label>
        <input type="number" id="cantidadTO" class="form-control" min="1">

        <button class="btn w-100 mt-3" id="btnGenerarInputs">Generar Campos</button>

        <div id="contenedorTO" class="mt-3"></div>

        <button class="btn w-100 mt-3" id="btnRegistrarTO">Registrar TO</button>
    </div>


    <!-- TARJETA NUEVA: ESCANEO QR PARA REGISTRAR SALIDA -->
    <div class="card mb-4" id="cardSalida" style="display:none;">
        <h3>Registrar Salida</h3>
        <p>Escanea el QR nuevamente para registrar la hora de salida del CEDI.</p>

        <div id="qr-reader-salida" style="width:100%;"></div>

        <button class="btn w-100 mt-3" id="btnConfirmarSalida" disabled>Confirmar Salida</button>
    </div>

</div>

<!-- JS -->
<script src="../JS/registros_seguridad.js"></script>

</body>

<audio id="beepSound" src="../Audio/beep.mp3" preload="auto"></audio>



</html>
