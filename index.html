<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tu CSS externo -->
  <link rel="stylesheet" href="css/index.css">

  <title>Vento</title>
</head>
<body>

  <div class="main-container">

    <!-- Logo -->
    <img src="Logos/VENTO.png" class="vento-logo" alt="Vento">

    <!-- Botón Transportista -->
    <button class="btn-vento" onclick="selectRole('transportista')">
      TRANSPORTISTA
    </button>

    <!-- Botón Analista -->
    <button class="btn-vento" onclick="selectRole('analista')">
      ANALISTA
    </button>

  </div>

  <script>
    function selectRole(role) {
      localStorage.setItem("roleSelected", role);
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
